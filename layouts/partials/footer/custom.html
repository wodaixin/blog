<div id="wechat-modal" style="display:none; z-index: 10000; position: fixed; top: 0; left: 0; width: 100%; height: 100%;">
  
  <div class="wechat-mask" style="position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);"></div>

  <div class="wechat-box">
    <span class="wechat-close">&times;</span>
    <img src="{{ "img/wechat.png" | relURL }}" alt="WeChat QR Code">
    <p class="wechat-note">商务联系<br><span>（拒绝基础科普，请备注来意）</span></p>
  </div>
</div>

<style>
/* 弹窗核心样式 */
.wechat-box {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #ffffff;
  padding: 30px 25px 20px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  animation: wechatFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  width: 280px;
}

/* 关闭按钮 */
.wechat-close {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 26px;
  color: #999;
  cursor: pointer;
  line-height: 1;
  transition: color 0.2s;
}

.wechat-close:hover {
  color: #333;
}

/* 二维码图片控制 */
.wechat-box img {
  width: 200px;
  height: auto;
  border-radius: 8px;
  border: 1px solid #f0f0f0;
}

/* 防御性话术排版 */
.wechat-note {
  margin-top: 16px;
  font-size: 15px;
  color: #333;
  font-weight: 500;
  line-height: 1.6;
}

.wechat-note span {
  display: block;
  margin-top: 4px;
  font-size: 12px;
  color: #888;
  font-weight: normal;
}

/* 进场动画：略带缩放的从下往上浮现 */
@keyframes wechatFadeIn {
  from { opacity: 0; transform: translate(-50%, -55%) scale(0.95); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

/* --- 侧边栏微信图标的悬浮气泡优化 --- */
a[href*="#wechat"] {
  position: relative;
}

/* 气泡本体 */
a[href*="#wechat"]:hover::after {
  content: "深度交流";
  position: absolute;
  bottom: 130%;
  left: 50%;
  transform: translateX(-50%);
  background: #222;
  color: #fff;
  padding: 6px 12px;
  font-size: 12px;
  border-radius: 6px;
  white-space: nowrap;
  pointer-events: none;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

/* 气泡下方的小三角 */
a[href*="#wechat"]:hover::before {
  content: "";
  position: absolute;
  bottom: 105%;
  left: 50%;
  transform: translateX(-50%);
  border-width: 5px;
  border-style: solid;
  border-color: #222 transparent transparent transparent;
  pointer-events: none;
}
</style>

<script>
// 交互逻辑：纯原生，零依赖，极致加载
document.addEventListener("DOMContentLoaded", function () {
  const wechatBtns = document.querySelectorAll('a[href*="#wechat"]');
  const modal = document.getElementById("wechat-modal");
  const mask = modal.querySelector('.wechat-mask');
  const closeBtn = modal.querySelector('.wechat-close');

  if (!modal) return;

  // 1. 点击唤起弹窗
  wechatBtns.forEach(btn => {
    btn.addEventListener("click", function (e) {
      e.preventDefault();
      modal.style.display = "block";
    });
  });

  // 2. 封装关闭动作
  const closeModal = () => {
    modal.style.display = "none";
  };

  // 3. 点击遮罩层关闭
  mask.addEventListener("click", closeModal);
  
  // 4. 点击右上角 X 关闭
  closeBtn.addEventListener("click", closeModal);
  
  // 5. 高管习惯：按键盘 ESC 键秒关
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modal.style.display === "block") {
      closeModal();
    }
  });
});
</script>
